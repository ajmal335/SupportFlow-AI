
services:
  - type: web
    name: supportflow-ai-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.11
